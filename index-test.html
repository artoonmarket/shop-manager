<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Կառավարման Համակարգ v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050510; --sidebar: #0c0c24; --card: #131332; --accent: #6366f1;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --text: #f1f5f9;
  --muted: #94a3b8; --border: rgba(255,255,255,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 30px 20px; position: fixed; height: 100vh; }
.main { margin-left: 260px; flex: 1; padding: 30px; }

/* Գործողությունների կոճակներ (Top Bar) */
.action-bar { 
  display: flex; gap: 15px; margin-bottom: 30px; 
  background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border);
}
.btn { 
  display: flex; align-items: center; gap: 8px; padding: 12px 20px; 
  border-radius: 12px; border: none; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; 
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-add { background: var(--accent); }
.btn-transit { background: var(--warning); }
.btn-sell { background: var(--success); }

/* Աղյուսակների դասավորվածություն (Իրար կողք) */
.tables-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 30px; }
@media (max-width: 1200px) { .tables-grid { grid-template-columns: 1fr; } }

.card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
.card-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.card-header h3 { font-family: 'Noto Serif Armenian'; font-size: 18px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 15px; text-align: left; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); }

/* Վաճառքի Պատմություն */
.history-filters { display: flex; gap: 10px; }
.filter-btn { 
  background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); 
  padding: 6px 15px; border-radius: 8px; cursor: pointer; font-size: 12px;
}
.filter-btn.active { background: var(--accent); border-color: var(--accent); }

/* Utility */
.sku { font-family: 'JetBrains Mono'; color: var(--accent); background: rgba(99,102,241,0.1); padding: 3px 6px; border-radius: 4px; }
#setup { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="setup">
  <div style="background:var(--card); padding:40px; border-radius:24px; text-align:center; border:1px solid var(--border);">
    <h2 style="font-family:'Noto Serif Armenian';">Մուտք Համակարգ</h2>
    <input type="text" id="url-input" placeholder="Google Web App URL" style="width:100%; padding:12px; margin:20px 0; border-radius:8px; border:none; background:#050510; color:#fff;">
    <button onclick="initApp()" class="btn btn-add" style="width:100%;">Միացնել</button>
  </div>
</div>

<div class="layout" id="app" style="display:none;">
  <aside class="sidebar">
    <h2 style="font-family:'Noto Serif Armenian'; margin-bottom:40px;">Պորտալ</h2>
    <div class="stat-box">
      <p style="color:var(--muted); font-size:11px; text-transform:uppercase;">Ընդհանուր Շահույթ</p>
      <div id="total-profit" style="font-size:20px; font-weight:700; color:var(--success);">0 ֏</div>
    </div>
  </aside>

  <main class="main">
    <!-- ԳՈՐԾՈՂՈՒԹՅՈՒՆՆԵՐ -->
    <div class="action-bar">
      <button class="btn btn-add">➕ Ավելացնել Ապրանք</button>
      <button class="btn btn-transit">🚚 Ավելացնել Տարանցիկ</button>
      <button class="btn btn-sell">💰 Գրանցել Վաճառք</button>
    </div>

    <!-- ՊԱՀԵՍՏ ԵՎ ՏՐԱՆԶԻՏ -->
    <div class="tables-grid">
      <!-- Պահեստ -->
      <div class="card">
        <div class="card-header"><h3>Առկա Պահեստ</h3></div>
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Անվանում</th>
              <th>Քանակ</th>
              <th>Վաճառքի Գին</th>
            </tr>
          </thead>
          <tbody id="inventory-body"></tbody>
        </table>
      </div>

      <!-- Տարանցիկ -->
      <div class="card">
        <div class="card-header"><h3>Ճանապարհին</h3></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Ապրանք</th>
              <th>Քանակ</th>
              <th>Ընդամենը</th>
            </tr>
          </thead>
          <tbody id="transit-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ՎԱՃԱՌՔԻ ՊԱՏՄՈՒԹՅՈՒՆ -->
    <div class="card">
      <div class="card-header">
        <h3>Վաճառքի Պատմություն</h3>
        <div class="history-filters">
          <button class="filter-btn active">Ըստ ամիսների</button>
          <button class="filter-btn">Ըստ տարիների</button>
        </div>
      </div>
      <table style="opacity: 0.7;">
        <thead>
          <tr>
            <th>Ժամանակաշրջան</th>
            <th>Վաճառված Քանակ</th>
            <th>Ընդհանուր Հասույթ</th>
            <th>Մաքուր Շահույթ</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Մայիս 2026</td>
            <td>142 հատ</td>
            <td>1,200,000 ֏</td>
            <td style="color:var(--success)">+340,000 ֏</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
let URL = "";
function initApp() {
  URL = document.getElementById('url-input').value;
  if(!URL) return;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadData();
}

async function loadData() {
  try {
    const res = await fetch(`${URL}?action=getData`);
    const data = await res.json();
    render(data);
  } catch(e) { console.error(e); }
}

function render(data) {
  const inv = document.getElementById('inventory-body');
  const trans = document.getElementById('transit-body');
  const fmt = n => new Intl.NumberFormat('hy-AM').format(n) + " ֏";

  inv.innerHTML = data.products.map(p => `
    <tr>
      <td><span class="sku">${p.sku}</span></td>
      <td><strong>${p.name}</strong></td>
      <td>${p.quantity} հատ</td>
      <td>${fmt(p.salePrice)}</td>
    </tr>
  `).join('');

  trans.innerHTML = data.transit.map(t => `
    <tr>
      <td>#${t.id}</td>
      <td>${t.name}</td>
      <td>${t.quantity} հատ</td>
      <td>${fmt(t.total)}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
